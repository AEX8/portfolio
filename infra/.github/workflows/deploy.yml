name: Deploy

on:
  push:
    branches: [main]      # deploy whenever main changes
  workflow_dispatch:      # also adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write         # lets the job request a GitHub OIDC token
  contents: read          # lets the job read the repo code

concurrency:
  group: deploy           # never run two deploys at the same time
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" --delete

      - name: Clear CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}"
          --paths "/*"